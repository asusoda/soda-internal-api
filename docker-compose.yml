services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      cache_from:
        - soda-internal-api:latest
      args:
        - COMMIT_HASH=${COMMIT_HASH:-unknown}
    image: soda-internal-api:latest
    container_name: soda-internal-api
    restart: unless-stopped
    # Memory and CPU cap of the container. See docs/operations.md, "Container limits".
    mem_limit: ${API_MEM_LIMIT:-1536m}
    cpus: ${API_CPUS:-1.5}
    # One worker with threads: SQLite takes one writer at a time, and login codes live in memory.
    # Raise the worker count after the move to Postgres.
    # Migrations run first; the schema comes from Alembic, not from create_all at startup.
    command:
      - sh
      - -c
      - alembic upgrade head && exec gunicorn --workers 1 --threads 8 --timeout 120 --bind 0.0.0.0:8000 main:app
    ports:
      # Loopback only: Nginx Proxy Manager forwards api.thesoda.io here, with TLS
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
      - ./google-secret.json:/app/google-secret.json:ro
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=0
      # Turns off the Werkzeug debugger and reloader. docker-compose.dev.yml overrides this to
      # false for local hot reloading.
      - IS_PROD=true
      # The bot runs in the bot service below, not in the API process
      - RUN_BOT_IN_API=false
      # One JSON object per log line
      - LOG_FORMAT=json
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - soda-network
      - browser-network

  bot:
    # The Discord bot (LeetCode daily post, helper and game cogs), from the same image as the API
    image: soda-internal-api:latest
    container_name: soda-bot
    restart: unless-stopped
    # Memory and CPU cap of the container. See docs/operations.md, "Container limits".
    mem_limit: ${BOT_MEM_LIMIT:-768m}
    cpus: ${BOT_CPUS:-1}
    command: ["python3", "bot_main.py"]
    depends_on:
      - api
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    environment:
      - IS_PROD=true
      - LOG_FORMAT=json
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - soda-network

  worker:
    # Background jobs (token cleanup, CSV imports, calendar sync). Postgres only: with SQLite
    # the API runs jobs itself, so this service is under the postgres profile.
    image: soda-internal-api:latest
    container_name: soda-worker
    restart: unless-stopped
    # Memory and CPU cap of the container. See docs/operations.md, "Container limits".
    mem_limit: ${WORKER_MEM_LIMIT:-1536m}
    cpus: ${WORKER_CPUS:-1}
    profiles: ["postgres"]
    command: ["python3", "worker_main.py"]
    depends_on:
      - api
    volumes:
      - ./.env:/app/.env:ro
      - ./google-secret.json:/app/google-secret.json:ro
    environment:
      - IS_PROD=true
      - LOG_FORMAT=json
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - soda-network
      - browser-network

  mcp:
    # MCP server for agents (streamable HTTP at :8001/mcp, machine tokens or OAuth). Off unless started
    # with --profile mcp.
    image: soda-internal-api:latest
    container_name: soda-mcp
    restart: unless-stopped
    # Memory and CPU cap of the container. See docs/operations.md, "Container limits".
    mem_limit: ${MCP_MEM_LIMIT:-768m}
    cpus: ${MCP_CPUS:-1}
    profiles: ["mcp"]
    command: ["python3", "mcp_main.py"]
    depends_on:
      - api
    ports:
      # Loopback only: the proxy forwards <API URL>/mcp here, with TLS
      - "127.0.0.1:8001:8001"
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    environment:
      - IS_PROD=true
      - LOG_FORMAT=json
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - soda-network
      - browser-network

  site:
    # The landing and docs site (site/), for platform.thesoda.io. Off unless started with --profile site.
    # It does not use the api, so it is recreated on its own.
    build:
      context: .
      dockerfile: Dockerfile.site
      cache_from:
        - soda-site:latest
    image: soda-site:latest
    container_name: soda-site
    restart: unless-stopped
    # Memory and CPU cap of the container. See docs/operations.md, "Container limits".
    mem_limit: ${SITE_MEM_LIMIT:-384m}
    cpus: ${SITE_CPUS:-0.5}
    profiles: ["site"]
    ports:
      - "127.0.0.1:3010:3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - soda-network

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
      cache_from:
        - soda-dashboard:latest
    image: soda-dashboard:latest
    container_name: soda-dashboard
    restart: unless-stopped
    # Memory and CPU cap of the container. See docs/operations.md, "Container limits".
    mem_limit: ${DASHBOARD_MEM_LIMIT:-256m}
    cpus: ${DASHBOARD_CPUS:-0.5}
    ports:
      - "5001:5001"
    depends_on:
      - api
    environment:
      - IS_PROD=true
      # The container writes them to config.js when it starts. Recreate the container after a change.
      # Required: the container stops when VITE_API_URL is empty.
      - VITE_API_URL=${VITE_API_URL:-}
      - VITE_SITE_URL=${VITE_SITE_URL:-}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5001"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - soda-network

  # SearXNG, the deployment default for web search, shared by every org without its own.
  # Off unless started with --profile search. Reached only on soda-network, as http://searxng:8080.
  searxng:
    image: mirror.gcr.io/searxng/searxng:2026.9.12-d4f00d15d
    container_name: soda-searxng
    restart: unless-stopped
    # Memory and CPU cap of the container. See docs/operations.md, "Container limits".
    mem_limit: ${SEARXNG_MEM_LIMIT:-512m}
    cpus: ${SEARXNG_CPUS:-0.5}
    profiles: ["search"]
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET:-}
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - soda-network

  # The shared browser: a Playwright server that renders pages that need JavaScript, for every org within
  # its knowledge.renders_per_day limit, and runs the ASU sign-in. Off unless started with --profile browser.
  # It is only on browser-network, so it cannot reach Postgres or the other services on soda-network, and
  # Platform lets it load public addresses only. deploy/browser/Dockerfile pins the Playwright version.
  browser:
    build:
      context: ./deploy/browser
    image: soda-browser:latest
    container_name: soda-browser
    restart: unless-stopped
    init: true
    # Memory and CPU cap of the container. See docs/operations.md, "Container limits".
    mem_limit: ${BROWSER_MEM_LIMIT:-1g}
    cpus: ${BROWSER_CPUS:-1}
    shm_size: 256m
    profiles: ["browser"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - browser-network

  # Postgres, off unless started with --profile postgres and DATABASE_URL points at it.
  # See docs/operations.md, "Move to Postgres".
  postgres:
    # Postgres 16 with pgvector, for knowledge search
    image: mirror.gcr.io/pgvector/pgvector:pg16
    container_name: soda-postgres
    restart: unless-stopped
    # Memory and CPU cap of the container. See docs/operations.md, "Container limits".
    mem_limit: ${POSTGRES_MEM_LIMIT:-1g}
    cpus: ${POSTGRES_CPUS:-1}
    profiles: ["postgres"]
    environment:
      - POSTGRES_DB=platform
      - POSTGRES_USER=platform
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - soda-network

volumes:
  data:
    driver: local

networks:
  soda-network:
    driver: bridge
  # The browser and the services that call it
  browser-network:
    driver: bridge
