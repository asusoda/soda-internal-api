# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Workflow lint rejects a cooldown under 7 days.

version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      python-deps:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: "/dashboard"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      npm-deps:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: "/site"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      site-npm:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      web-npm:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
