name: Images

# Builds the API, web, dashboard and site images on every PR so a broken Dockerfile is caught before merge.
# On main, pushes them to GHCR tagged with the commit sha and "main".
# A later push waits. Cancelling a publish would leave GHCR with a mix of old and new tags.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # Push the image to GHCR.
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: Dockerfile.api
          - name: web
            dockerfile: Dockerfile.web
          - name: dashboard
            dockerfile: Dockerfile.dashboard
          - name: site
            dockerfile: Dockerfile.site
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        persist-credentials: false

    - uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0
      with:
        driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

    - name: Log in to GHCR
      if: github.event_name != 'pull_request'
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Image name
      id: image
      env:
        IMAGE_NAME: ${{ matrix.name }}
      run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}-${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

    # Dockerfile.dashboard stops on an empty VITE_API_URL. With no repository variable, the image calls localhost.
    - name: Build and push
      uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
      with:
        context: .
        file: ${{ matrix.dockerfile }}
        push: ${{ github.event_name != 'pull_request' }}
        build-args: |
          COMMIT_HASH=${{ github.sha }}
          VITE_API_URL=${{ vars.VITE_API_URL || 'http://localhost:8000' }}
          VITE_SITE_URL=${{ vars.VITE_SITE_URL }}
          REACT_APP_API_URL=${{ vars.REACT_APP_API_URL }}
        tags: |
          ${{ steps.image.outputs.ref }}:${{ github.sha }}
          ${{ steps.image.outputs.ref }}:main
        cache-from: type=gha,scope=${{ matrix.name }}
        # A fork pull request cannot write the cache. ignore-error keeps that build green.
        cache-to: type=gha,mode=max,scope=${{ matrix.name }},ignore-error=true
