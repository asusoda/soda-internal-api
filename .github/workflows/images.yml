name: Images

# Builds the API, dashboard and site images on every PR so a broken Dockerfile is caught before merge.
# On main, pushes them to GHCR tagged with the commit sha and "main".
# A later push waits. Cancelling a publish would leave GHCR with a mix of old and new tags.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # Push the image to GHCR.
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: Dockerfile.api
          - name: dashboard
            dockerfile: Dockerfile.dashboard
          - name: site
            dockerfile: Dockerfile.site
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      with:
        driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

    - name: Log in to GHCR
      if: github.event_name != 'pull_request'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Image name
      id: image
      env:
        IMAGE_NAME: ${{ matrix.name }}
      run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}-${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

    # Dockerfile.dashboard stops on an empty VITE_API_URL. With no repository variable, the image calls localhost.
    - name: Build and push
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: ${{ matrix.dockerfile }}
        push: ${{ github.event_name != 'pull_request' }}
        build-args: |
          COMMIT_HASH=${{ github.sha }}
          VITE_API_URL=${{ vars.VITE_API_URL || 'http://localhost:8000' }}
          VITE_SITE_URL=${{ vars.VITE_SITE_URL }}
        tags: |
          ${{ steps.image.outputs.ref }}:${{ github.sha }}
          ${{ steps.image.outputs.ref }}:main
        cache-from: type=gha,scope=${{ matrix.name }}
        # A fork pull request cannot write the cache. ignore-error keeps that build green.
        cache-to: type=gha,mode=max,scope=${{ matrix.name }},ignore-error=true
