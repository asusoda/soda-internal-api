name: Images

# Builds the API, dashboard and site images. check.yml calls this workflow on each push and PR,
# so a broken Dockerfile is caught before merge. On main, pushes them to GHCR tagged with the commit
# sha and "main", and the deploy in check.yml waits for this workflow, then pulls those images.
# The images have no deployment settings in them: the dashboard reads its URLs from the container
# env when it starts.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # Push the image and its build cache to GHCR.
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: Dockerfile.api
          - name: dashboard
            dockerfile: Dockerfile.dashboard
          - name: site
            dockerfile: Dockerfile.site
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      with:
        driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

    # A pull request logs in too, so that it can read the build cache of main.
    - name: Log in to GHCR
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Image name
      id: image
      env:
        IMAGE_NAME: ${{ matrix.name }}
        PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      run: |
        ref="ghcr.io/${GITHUB_REPOSITORY,,}-${IMAGE_NAME}"
        echo "ref=$ref" >> "$GITHUB_OUTPUT"
        echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
        if [ "$PUBLISH" = "true" ]; then
          echo "cache-to=type=registry,ref=$ref:buildcache,mode=max,ignore-error=true" >> "$GITHUB_OUTPUT"
        fi

    # The build cache is in GHCR beside the image. A registry cache export skips the layers that
    # GHCR has already, so it is faster than the GitHub Actions cache. Only main writes it.
    - name: Build and push
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: ${{ matrix.dockerfile }}
        push: ${{ steps.image.outputs.publish == 'true' }}
        build-args: |
          COMMIT_HASH=${{ github.sha }}
        tags: |
          ${{ steps.image.outputs.ref }}:${{ github.sha }}
          ${{ steps.image.outputs.ref }}:main
        cache-from: type=registry,ref=${{ steps.image.outputs.ref }}:buildcache
        cache-to: ${{ steps.image.outputs.cache-to }}
