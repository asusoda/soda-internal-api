name: CD

# Deploys the SoDA server. check.yml calls this workflow after its jobs pass
# on a push to main in asusoda/platform. The deploy checks out that commit.

on:
  workflow_call:
    inputs:
      deploy_sha:
        description: The commit that passed Check
        required: true
        type: string
    secrets:
      VPS_HOST:
        required: true
      VPS_USERNAME:
        required: true
      VPS_SSH_PORT:
        required: true
      VPS_SSH_KEY:
        required: false
      VPS_SSH_PASSWORD:
        required: false

permissions: {}

jobs:
  deploy:
    name: Deploy to Production
    # GitHub records each run as a deployment to this environment, with its result, on the Deployments page.
    environment:
      name: production
      url: https://api.thesoda.io/health
    permissions: {}
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
    - name: Deploy via SSH
      uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
      env:
        DEPLOY_SHA: ${{ inputs.deploy_sha }}
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        port: ${{ secrets.VPS_SSH_PORT }}
        # A deploy key (VPS_SSH_KEY) is used when set; the password stays as a fallback until it is.
        key: ${{ secrets.VPS_SSH_KEY }}
        password: ${{ secrets.VPS_SSH_PASSWORD }}
        version: "1.8.2"
        command_timeout: 30m
        envs: DEPLOY_SHA
        script: |
          set -eu

          PROJECT_DIR="${PROJECT_DIR:-/var/www/soda-internal-api}"
          if [ ! -d "$PROJECT_DIR" ]; then
            echo "Error: Project directory $PROJECT_DIR not found"
            exit 1
          fi
          cd "$PROJECT_DIR"

          if ! printf '%s' "$DEPLOY_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "The commit from Check is not a 40-character sha."
            exit 1
          fi

          DEPLOY_FROM="$(git rev-parse HEAD)"
          PREVIOUS_SHA=""
          if [ -f .deploy/deployed-sha ]; then
            PREVIOUS_SHA="$(tr -d '[:space:]' < .deploy/deployed-sha)"
          fi
          if ! printf '%s' "$PREVIOUS_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            PREVIOUS_SHA=""
          fi

          # Update the checkout first, so the next steps use the Makefile of this commit.
          echo "Updating the checkout from $DEPLOY_FROM to $DEPLOY_SHA..."
          git fetch origin "$DEPLOY_SHA" || git fetch origin main
          git checkout --detach --force "$DEPLOY_SHA"

          echo "Backing up the database..."
          make backup

          restore_deployed_sha() {
            mkdir -p .deploy
            if [ -n "$PREVIOUS_SHA" ]; then
              tmp="$(mktemp .deploy/deployed-sha.XXXXXX)"
              printf '%s\n' "$PREVIOUS_SHA" > "$tmp"
              mv -f "$tmp" .deploy/deployed-sha
            else
              rm -f .deploy/deployed-sha
            fi
            rm -f data/deployed-sha
          }

          echo "Starting deployment..."
          if ! make deploy DEPLOY_FROM="$DEPLOY_FROM" DEPLOY_SHA="$DEPLOY_SHA"; then
            echo "Deployment failed, rolling back..."
            restore_deployed_sha
            make logs || true
            make rollback || true
            exit 1
          fi

          echo "Verifying deployment health..."
          if ! make health; then
            echo "Health check failed, rolling back..."
            restore_deployed_sha
            make status || true
            make rollback || true
            exit 1
          fi

          echo "Deployment completed successfully."

  # Runs deploy/ansible/firewall.yml against the same server after the deploy passes.
  firewall:
    name: Firewall
    needs: deploy
    permissions: {}
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.deploy_sha }}
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        version: "latest-known"
        python-version: "3.12"
        enable-cache: false

    - name: Run the firewall playbook
      working-directory: deploy/ansible
      env:
        VPS_HOST: ${{ secrets.VPS_HOST }}
        VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
        VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
        # The deploy step does not check the host key either.
        ANSIBLE_HOST_KEY_CHECKING: "False"
        ANSIBLE_FORCE_COLOR: "1"
      run: |
        set -eu
        if [ -n "$VPS_SSH_KEY" ]; then
          (umask 077 && printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/vps_key")
          export ANSIBLE_PRIVATE_KEY_FILE="$RUNNER_TEMP/vps_key"
          # Like the deploy step, sign in with the key when it is set.
          unset VPS_SSH_PASSWORD
        else
          # Ansible needs sshpass to sign in with a password.
          sudo apt-get update -q && sudo apt-get install -y -q sshpass
        fi
        uv run --frozen --only-group deploy ansible-playbook firewall.yml
