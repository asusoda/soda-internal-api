name: Check

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the checks of the old push. On main, a new push waits:
# a cancelled check would skip the deploy of that commit.
jobs:
  check:
    timeout-minutes: 20
    concurrency:
      group: check-python-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        version: "latest-known"
        python-version: "3.12"
        enable-cache: true

    - name: Install dependencies
      run: uv sync --frozen

    # Lint, format check, type check, tests (including the API contract tests) and migrations.
    # Nothing is fixed or committed here: a failure blocks the merge.
    - name: Run all checks
      run: make ci

    - name: Run bandit security checks
      run: uv run bandit -c pyproject.toml -r . -f txt

  # The same tests and migrations against Postgres, the production database from phase 2 on.
  postgres:
    timeout-minutes: 20
    concurrency:
      group: check-postgres-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector for the knowledge module
        image: mirror.gcr.io/pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_URL: postgresql://postgres:postgres@localhost:5432/platform_test
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        version: "latest-known"
        python-version: "3.12"
        enable-cache: true

    - name: Install dependencies
      run: uv sync --frozen

    - name: Run migrations and check them against the models
      run: DATABASE_URL=$PG_URL uv run alembic upgrade head && DATABASE_URL=$PG_URL uv run alembic check

    - name: Run tests
      run: TEST_DATABASE_URL=$PG_URL uv run pytest tests -q

  # Type check, unit tests and build of the officer dashboard.
  dashboard:
    timeout-minutes: 15
    concurrency:
      group: check-dashboard-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: dashboard/package-lock.json

    - run: npm ci
    - run: npm test
    - run: npm run build

  # The landing site build. A broken page in site/ or docs/ fails here, before a deploy.
  site:
    timeout-minutes: 20
    concurrency:
      group: check-site-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: site/package-lock.json

    - run: npm ci
    - run: npm run build

  # Builds the four images. On main it pushes them to GHCR, and the deploy pulls them.
  # A later push to main waits: cancelling a publish would leave GHCR with a mix of old and new tags.
  images:
    concurrency:
      group: check-images-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      packages: write # Push the images and their build cache to GHCR.
    uses: $/.github/workflows/images.yml

  lint:
    name: Lint workflows
    timeout-minutes: 10
    concurrency:
      group: check-lint-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Run actionlint
      # actionlint 1.7.12 rejects GitHub's $/ form for a workflow in this repo.
      run: |
        curl -fsSL -o actionlint.tar.gz -L https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
        echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c
        tar -xzf actionlint.tar.gz actionlint
        ./actionlint -color -ignore 'reusable workflow call "\$/\.github/workflows/(cd|images)\.yml"'

    - name: Run zizmor
      uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
      with:
        advanced-security: false
        annotations: true
        version: "1.30.1"

  # After the jobs above pass, deploy that same commit with the images that the images job pushed.
  # A pull request skips this job.
  deploy:
    name: Deploy to Production
    needs: [check, postgres, dashboard, site, images, lint]
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'asusoda/platform'
    concurrency:
      group: cd-production
      cancel-in-progress: false
    permissions: {}
    uses: $/.github/workflows/cd.yml
    with:
      deploy_sha: ${{ github.sha }}
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
      VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
