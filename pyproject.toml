[project]
name = "soda-platform"
version = "0.1.0"
description = "SoDA Platform"
authors = [{name = "SoDA", email = "asu@thesoda.io"}]
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp>=3.13.5",
    "aiosignal==1.4.0",
    "asgiref==3.12.1",
    "async-timeout==5.0.1",
    "attrs==26.1.0",
    "blinker==1.9.0",
    "cachetools==7.2.1",
    "certifi==2026.7.22",
    "charset-normalizer==3.5.2",
    "click==8.5.0",
    "colorama==0.4.6",
    "dnspython==2.8.0",
    "flask==3.1.3",
    "flask-cors==6.0.5",
    "frozenlist==1.8.0",
    "greenlet==3.5.6",
    "h11==0.16.0",
    "idna>=3.13",
    "importlib-metadata==9.0.1",
    "itsdangerous==2.2.0",
    "jinja2==3.1.6",
    "markupsafe==3.0.4",
    "multidict>=6.3.2",
    "nest-asyncio==1.6.0",
    "oauthlib==4.0.0",
    "py-cord>=2.7.2",
    "pyjwt>=2.12.1",
    "psycopg2-binary>=2.9.12",
    "requests==2.34.2",
    "requests-oauthlib==2.0.0",
    "sqlalchemy==2.1.3",
    "typing-extensions>=4.13.1",
    "urllib3==2.8.0",
    "werkzeug==3.1.9",
    "yarl>=1.23.0",
    "zipp==4.1.1",
    "google-auth>=2.49.2",
    "google-api-python-client>=2.194.0",
    "cryptography>=46.0.7",
    "gunicorn==26.2.0",
    "notion-client>=3.0.0",
    "google-auth-oauthlib>=1.3.1",
    "google-api-core>=2.30.3",
    "sentry-sdk[flask]>=2.58.0",
    "pytz>=2026.1.post1",
    "python-dateutil>=2.9.0.post0",
    "tzdata>=2026.2",
    "colorlog>=6.9.0",
    "clerk-backend-api>=5.0.6",
    "alembic>=1.18.4",
    "procrastinate==3.10.0",
    "croniter>=6.0",
    "mcp==2.3.0",
    "jsonschema>=4.20",
    "beautifulsoup4>=4.13",
    "lxml>=5.3",
    "defusedxml>=0.7.1",
    "pyyaml>=6.0.3",
    "paramiko>=3.4",
    "httpx>=0.28.1",
    "uvicorn>=0.54.0",
    "pypdf>=6.19.0",
]

[project.optional-dependencies]
# The ASU sign-in (submodules/asu/signin). Install with `uv sync --extra browser`, then `playwright install chromium`.
browser = ["playwright>=1.49"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "--verbose"

# An application, not a library: uv installs the dependencies only.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.12",
    "ty>=0.0.14",
    "bandit>=1.9.4",
    "pre-commit>=4.6.0",
    "import-linter>=2.15",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.bandit]
exclude_dirs = ["tests", "node_modules", ".venv"]

# Module boundaries, checked in CI by `lint-imports` (docs/writing-a-module.md).
[tool.importlinter]
root_packages = ["core", "modules", "submodules"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core imports no module"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = ["modules", "submodules"]

[[tool.importlinter.contracts]]
name = "service modules do not import Flask"
type = "forbidden"
# Every service, models, jobs and tools file, by wildcard. List each other Flask-free file below.
source_modules = [
    "modules.*.service",
    "modules.*.models",
    "modules.*.jobs",
    "modules.*.tools",
